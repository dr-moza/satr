<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ربط حساب تيك توك</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #1e293b; padding: 30px; border-radius: 15px; text-align: center; max-width: 400px; width: 90%; }
    button { background: #fe2c55; color: white; border: none; padding: 15px 25px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 15px; }
    .code { background: #0f172a; padding: 12px; border-radius: 8px; word-break: break-all; color: #38bdf8; margin-top: 15px; direction: ltr; font-family: monospace; }
  </style>
</head>
<body>
  <div class="box">
    <div id="before">
      <h2>ربط حساب تيك توك 🚀</h2>
      <p>اضغط الزر بالأسفل للموافقة على ربط حسابك بالبوت التلقائي</p>
      <button onclick="login()">ربط حساب تيك توك الآن</button>
    </div>
    <div id="after" style="display:none;">
      <h2 style="color:#4ade80;">✅ تم الربط بنجاح!</h2>
      <p>انسخ الكود ده وابعتهولي عشان أشغل لك الحساب:</p>
      <div class="code" id="codeBox"></div>
      <button style="background:#10b981;" onclick="copy()">نسخ الكود</button>
    </div>
  </div>
  <script>
    const CLIENT_KEY = "awo6cevbukkr05ix";
    const REDIRECT_URI = "https://dr-moza.github.io/satr/connect.html";

    function login() {
      window.location.href = `https://www.tiktok.com/v2/auth/authorize/?client_key=${CLIENT_KEY}&scope=user.info.basic,video.upload&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&state=123`;
    }

    const code = new URLSearchParams(window.location.search).get("code");
    if (code) {
      document.getElementById("before").style.display = "none";
      document.getElementById("after").style.display = "block";
      document.getElementById("codeBox").innerText = code;
    }

    function copy() {
      navigator.clipboard.writeText(document.getElementById("codeBox").innerText);
      alert("تم النسخ! ابعته الآن.");
    }
  </script>
</body>
</html>
